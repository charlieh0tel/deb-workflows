[package]
name = "fixture-prebuild"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fixture-prebuild"
path = "src/main.rs"

# generated/stamp.txt is not a cargo artifact: an earlier job uploads it
# and prebuilt-artifact brings it in.
[package.metadata.deb]
maintainer = "Test <test@example.com>"
assets = [
    ["target/release/fixture-prebuild", "usr/bin/", "755"],
    ["generated/stamp.txt", "usr/share/fixture-prebuild/", "644"],
]
