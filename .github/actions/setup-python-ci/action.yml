name: Set up a Python CI job
description: Apt packages and the Python or uv toolchain shared by the lint/format/test jobs.

# The caller must have checked its own repository out already. This action
# cannot do it: the caller has to check out before fetching the copy of this
# repository that this action is loaded from, because a root checkout wipes a
# non-empty workspace and would delete that copy.

inputs:
  python-version:
    description: "Python version"
    required: false
    default: "3.12"
  system-packages:
    description: "Space-separated apt packages to install (empty to skip)"
    required: false
    default: ""
  uv:
    description: "'true' to install uv, anything else to install CPython via setup-python"
    required: true

runs:
  using: composite
  steps:
  # Everything under .deb-workflows is this repository, checked out inside the
  # caller's workspace so their jobs can load these actions. A caller's own
  # `ruff check .` walks the whole workspace and would lint it -- failing their
  # build on our code, under whatever rule set they happen to enable. Ruff (and
  # anything else built on the same ignore machinery) honours a nested
  # .gitignore, and this directory is its own checkout, so ignoring everything
  # in it keeps our files out of their results.
  - shell: bash
    env:
      ACTION_PATH: ${{ github.action_path }}
    run: |
      root=$(cd "${ACTION_PATH}/../../.." && pwd)
      if [ ! -f "${root}/.github/workflows/python-ci.yml" ]; then
        echo "::error::expected the deb-workflows checkout at ${root}"
        exit 1
      fi
      printf '*\n' > "${root}/.gitignore"
      echo "Hid ${root} from tools that walk the workspace"

  # Before the toolchain, since a Python package may need its headers or shared
  # library present at install or import time.
  - name: Install system packages
    if: inputs.system-packages != ''
    shell: bash
    env:
      PKGS: ${{ inputs.system-packages }}
    run: |
      # Word splitting of the package list is intentional.
      # shellcheck disable=SC2086
      sudo apt-get update && sudo apt-get install -y --no-install-recommends $PKGS
  - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
    if: inputs.uv != 'true'
    with:
      python-version: ${{ inputs.python-version }}
  - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
    if: inputs.uv == 'true'
    with:
      python-version: ${{ inputs.python-version }}
      enable-cache: true
