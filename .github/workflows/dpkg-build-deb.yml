name: Build Debian Package (dpkg)

on:
  workflow_call:
    inputs:
      extra-build-deps:
        description: "Extra build dependencies for jtdor/build-deb-action"
        required: false
        type: string
        default: "devscripts git"
      before-build-hook:
        description: "Command to run before building"
        required: false
        type: string
        default: ""
      source-dir:
        description: "Directory containing the debian/ tree (relative to the repo root)"
        required: false
        type: string
        default: "./"
      os:
        description: "Runner OS"
        required: false
        type: string
        default: "ubuntu-latest"
      artifact-name:
        description: "Name for the uploaded artifact"
        required: false
        type: string
        default: "debian-package"

jobs:
  build-deb:
    runs-on: ${{ inputs.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Build Package
      uses: jtdor/build-deb-action@473136f14a42a231124c1f7cefaedfe941203c38  # v1.9.1
      with:
        source-dir: ${{ inputs.source-dir }}
        before-build-hook: ${{ inputs.before-build-hook }}
        extra-build-deps: ${{ inputs.extra-build-deps }}

    - name: Upload Debian package
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: debian/artifacts/*.deb
        retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        path: artifacts

    # A tag with a hyphen (v1.2.0-beta.1) is a semver pre-release and is
    # published as a GitHub pre-release, which never counts as the latest
    # release, so nothing that fetches the latest release picks it up. The
    # suffix must mix digits and non-digits: only then does cargo-deb write
    # 1.2.0~beta.1, which Debian sorts before 1.2.0. It leaves 1.2.0-beta
    # alone, and Debian sorts that after 1.2.0. Inlined in each release job,
    # since a reusable workflow cannot source a script from this repo.
    - name: Check pre-release tag
      id: prerelease-tag
      env:
        TAG: ${{ github.ref_name }}
      run: |
        prerelease=false
        if [[ "${TAG}" == *-* ]]; then
          suffix="${TAG#*-}"
          if [[ ! "${suffix}" =~ [0-9] || ! "${suffix}" =~ [^0-9] ]]; then
            echo "::error::Pre-release tag ${TAG} needs a numbered suffix such as -beta.1 or -rc1, not -${suffix}."
            exit 1
          fi
          prerelease=true
        fi
        echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

    - name: Create Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
      with:
        files: artifacts/**/*.deb
        draft: false
        prerelease: ${{ steps.prerelease-tag.outputs.prerelease }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
