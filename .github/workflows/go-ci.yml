name: Go CI

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version (e.g. stable, 1.22)"
        required: false
        type: string
        default: "stable"

# Pure CI: never writes. A called workflow can only narrow the caller's
# token, never widen it.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
    - run: go build ./...
    - run: go test ./...
    - run: go vet ./...
