name: Test python-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # (d) non-uv caller: no uv markers at the repo root, so detection picks pip.
  python-ci:
    uses: ./.github/workflows/python-ci.yml
    with:
      test-command: "pytest tests/python/"
      lint-command: "ruff check tests/python/"
      format-check-command: "ruff format --check tests/python/"

  # (a) uv caller with a valid lock and its tools locked as project deps:
  # lock-check=auto asserts the lock, and ruff/pytest come from the project
  # environment. Also exercises system-packages (libportaudio2 is small and
  # mirrors the sounddevice case that motivated the input).
  python-ci-uv:
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: tests/python-uv
      system-packages: libportaudio2
      test-command: "pytest ."
      lint-command: "ruff check ."
      format-check-command: "ruff format --check ."

  # uv caller with a lock but no tools in its deps: exercises the
  # 'uv run --frozen --with' fallback. One job covers that branch.
  python-ci-uv-fallback:
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: tests/python-uv-nodeps
      test-command: "pytest ."
      lint-command: ""
      format-check-command: ""

  # (c) uv caller with no lockfile: detection still fires on [tool.uv], sync
  # must stay bare (--locked and --frozen both require a lockfile to exist).
  python-ci-uv-nolock:
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: tests/python-uv-nolock
      test-command: "pytest ."
      lint-command: ""
      format-check-command: ""

  # (b) uv caller with a deliberately stale lock: the sync must FAIL.
  #
  # This cannot be a `uses:` job -- GitHub does not allow continue-on-error on
  # jobs that call a reusable workflow -- but step-level continue-on-error is
  # fine, so this drives the real uv-sync action rather than a copy of it.
  #
  # Referenced relatively on purpose: that resolves to THIS commit's action.
  # The jobs above reach the same place by a longer route -- python-ci.yml
  # checks out its own commit and loads the actions from there -- so a PR now
  # tests its own actions either way.
  stale-lock-must-fail:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v9.0.0  # no floating vN tag published after v7
      with:
        python-version: "3.12"
        enable-cache: true
    - name: Record the committed lock
      id: before
      working-directory: tests/python-uv-stale
      run: echo "sum=$(md5sum uv.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
    - name: Sync the stale fixture (expected to fail)
      id: sync
      continue-on-error: true
      uses: ./.github/actions/uv-sync
      with:
        working-directory: tests/python-uv-stale
        lock-check: auto
    - name: Assert it failed and left the lock alone
      working-directory: tests/python-uv-stale
      env:
        OUTCOME: ${{ steps.sync.outcome }}
        BEFORE: ${{ steps.before.outputs.sum }}
      run: |
        if [ "${OUTCOME}" != failure ]; then
          echo "::error::a stale uv.lock was accepted (uv-sync outcome: ${OUTCOME})"
          exit 1
        fi
        if [ "${BEFORE}" != "$(md5sum uv.lock | cut -d' ' -f1)" ]; then
          echo "::error::a stale uv.lock was rewritten"
          exit 1
        fi
        echo "Stale lock correctly rejected, and left untouched."
