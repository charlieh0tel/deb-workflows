name: Test rust-build-deb (multi-package)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  # fixture-bundle ships fixture-b's binary, which `cargo build -p
  # fixture-bundle` does not build.
  build-deb-packages:
    uses: ./.github/workflows/rust-build-deb.yml
    with:
      packages: fixture-bundle fixture-a
      artifact-suffix: packages
      run-tests: false
      targets: '[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04","arch":"amd64"}]'

  # The deprecated `package` input, kept working until v2.
  build-deb-package:
    uses: ./.github/workflows/rust-build-deb.yml
    with:
      package: fixture-b
      artifact-suffix: fixture-b
      run-tests: false
      targets: '[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04","arch":"amd64"}]'

  # An asset cargo-deb needs, made by an earlier job (like firmware would be).
  make-prebuilt:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - run: |
        mkdir generated
        echo "${GITHUB_RUN_ID}" > generated/stamp.txt
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: prebuilt-stamp
        path: generated/stamp.txt
        if-no-files-found: error
        retention-days: 1

  build-deb-prebuilt:
    needs: make-prebuilt
    uses: ./.github/workflows/rust-build-deb.yml
    with:
      packages: fixture-prebuild
      artifact-suffix: prebuilt
      run-tests: false
      audit: false
      prebuilt-artifact: prebuilt-stamp
      prebuilt-path: tests/rust-deb-prebuild/generated
      targets: '[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04","arch":"amd64"}]'

  check-prebuilt-package:
    needs: build-deb-prebuilt
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: debian-package-prebuilt-amd64
        path: artifact
    - name: Package carries this run's stamp
      run: |
        dpkg-deb -x artifact/*.deb root
        test "$(cat root/usr/share/fixture-prebuild/stamp.txt)" = "${GITHUB_RUN_ID}"

  # The tests run on arm64, not only on amd64.
  build-deb-arm64-tests:
    uses: ./.github/workflows/rust-build-deb.yml
    with:
      packages: fixture-a
      artifact-suffix: arm64-tests
      audit: false
      targets: '[{"target":"aarch64-unknown-linux-gnu","os":"ubuntu-22.04-arm","arch":"arm64"}]'
