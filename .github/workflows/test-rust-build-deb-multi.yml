name: Test rust-build-deb (multi-package)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  # fixture-bundle ships fixture-b's binary, which `cargo build -p
  # fixture-bundle` does not build.
  build-deb-packages:
    uses: ./.github/workflows/rust-build-deb.yml
    with:
      packages: fixture-bundle fixture-a
      artifact-suffix: packages
      run-tests: false
      targets: '[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04","arch":"amd64"}]'

  # The deprecated `package` input, kept working until v2.
  build-deb-package:
    uses: ./.github/workflows/rust-build-deb.yml
    with:
      package: fixture-b
      artifact-suffix: fixture-b
      run-tests: false
      targets: '[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04","arch":"amd64"}]'
