name: Build Debian Package

on:
  workflow_call:
    inputs:
      build-deps:
        description: "Space-separated list of build dependencies to install (e.g. 'libdbus-1-dev')"
        required: false
        type: string
        default: ""
      targets:
        description: "JSON array of targets to build"
        required: false
        type: string
        default: '[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04","arch":"amd64"},{"target":"aarch64-unknown-linux-gnu","os":"ubuntu-22.04-arm","arch":"arm64"}]'
      run-tests:
        description: "Run tests on amd64"
        required: false
        type: boolean
        default: true
      package:
        description: "Cargo package to build (cargo deb -p). Empty = default package."
        required: false
        type: string
        default: ""
      artifact-suffix:
        description: "Suffix to disambiguate artifacts when one repo builds several packages."
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  build-deb:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.targets) }}

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v6
      with:
        path: target
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-target-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

    - name: Install build dependencies
      env:
        BUILD_DEPS: ${{ inputs.build-deps }}
      run: |
        read -ra extra_deps <<< "$BUILD_DEPS"
        sudo apt-get update
        sudo apt-get install -y pkg-config "${extra_deps[@]}"

    - name: Cache cargo-deb
      id: cache-cargo-deb
      uses: actions/cache@v6
      with:
        path: ~/.cargo/bin/cargo-deb
        key: cargo-deb-${{ runner.os }}-${{ runner.arch }}-v1

    - name: Install cargo-deb
      if: steps.cache-cargo-deb.outputs.cache-hit != 'true'
      run: cargo install cargo-deb

    - name: Build release binary
      env:
        TARGET: ${{ matrix.target }}
        PACKAGE: ${{ inputs.package }}
      run: |
        if [ -n "${PACKAGE}" ]; then
          cargo build --release -p "${PACKAGE}" --target "${TARGET}" --verbose
        else
          cargo build --release --target "${TARGET}" --verbose
        fi

    - name: Run tests
      if: matrix.arch == 'amd64' && inputs.run-tests
      run: cargo test --verbose

    - name: Build Debian package
      env:
        TARGET: ${{ matrix.target }}
        PACKAGE: ${{ inputs.package }}
      run: |
        if [ -n "${PACKAGE}" ]; then
          cargo deb --no-build -p "${PACKAGE}" --target "${TARGET}"
        else
          cargo deb --no-build --target "${TARGET}"
        fi

    - name: Get package filename
      id: package
      env:
        TARGET: ${{ matrix.target }}
      run: |
        PACKAGE=$(find "target/${TARGET}/debian" -maxdepth 1 -name '*.deb' | head -n 1)
        echo "path=${PACKAGE}" >> "${GITHUB_OUTPUT}"
        echo "name=$(basename "${PACKAGE}")" >> "${GITHUB_OUTPUT}"

    - name: Upload Debian package as artifact
      uses: actions/upload-artifact@v7
      with:
        name: debian-package-${{ inputs.artifact-suffix != '' && format('{0}-', inputs.artifact-suffix) || '' }}${{ matrix.arch }}
        path: ${{ steps.package.outputs.path }}
        retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
        pattern: debian-package-*

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: artifacts/**/*.deb
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
