name: Test rust-build-exes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  rust-build-exes:
    uses: ./.github/workflows/rust-build-exes.yml
    with:
      # amd64 Linux plus Windows: Windows is where the shell/quoting bug in
      # b6277f2 lived, so it is worth the runner minutes. arm64 Linux is
      # dropped to keep this cheap; the matrix plumbing is shared with
      # rust-build-deb, which is covered by its own test.
      targets: >-
        [{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-latest","arch":"amd64"},
         {"target":"x86_64-pc-windows-msvc","os":"windows-latest","arch":"amd64"}]

  # The package, artifact-suffix and test-windows inputs: one package of
  # the workspace, tested and built on Windows, under its own artifact
  # name so it does not collide with the call above.
  rust-build-exes-package:
    uses: ./.github/workflows/rust-build-exes.yml
    with:
      package: fixture-a
      artifact-suffix: fixture-a
      test-windows: true
      audit: false
      targets: >-
        [{"target":"x86_64-pc-windows-msvc","os":"windows-latest","arch":"amd64"}]

  check-package-artifact:
    needs: rust-build-exes-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: binaries-fixture-a-x86_64-pc-windows-msvc
        path: artifact
    - name: Only fixture-a's binary
      run: |
        ls -l artifact
        test "$(ls artifact)" = "fixture-a-x86_64-pc-windows-msvc.exe"
