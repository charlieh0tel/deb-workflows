name: Build and Release

on:
  workflow_call:
    inputs:
      build-deps:
        description: "Space-separated list of build dependencies to install on Linux"
        required: false
        type: string
        default: ""
      targets:
        description: "JSON array of targets to build"
        required: false
        type: string
        default: '[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-latest","arch":"amd64"},{"target":"aarch64-unknown-linux-gnu","os":"ubuntu-22.04-arm","arch":"arm64"},{"target":"x86_64-pc-windows-msvc","os":"windows-latest","arch":"amd64"}]'
      run-tests:
        description: "Run tests on amd64 Linux"
        required: false
        type: boolean
        default: true
      features:
        description: "Comma-separated list of cargo features to enable"
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.targets) }}

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v6
      with:
        path: target
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-target-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

    - name: Install build dependencies (Linux)
      if: runner.os == 'Linux'
      env:
        BUILD_DEPS: ${{ inputs.build-deps }}
      run: |
        read -ra extra_deps <<< "$BUILD_DEPS"
        sudo apt-get update
        sudo apt-get install -y pkg-config "${extra_deps[@]}"

    # bash everywhere: the default shell on Windows is PowerShell,
    # where "${TARGET}" is an (empty) PowerShell variable, not the
    # environment variable.
    - name: Build release binary
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
        FEATURES: ${{ inputs.features }}
      run: |
        args=()
        if [[ -n "$FEATURES" ]]; then args+=(--features "$FEATURES"); fi
        cargo build --release --target "${TARGET}" "${args[@]}" --verbose

    - name: Run tests
      if: matrix.os == 'ubuntu-latest' && matrix.arch == 'amd64' && inputs.run-tests
      shell: bash
      env:
        FEATURES: ${{ inputs.features }}
      run: |
        args=()
        if [[ -n "$FEATURES" ]]; then args+=(--features "$FEATURES"); fi
        cargo test "${args[@]}" --verbose

    - name: Collect binaries (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir -p staging
        while IFS= read -r f; do
          name=$(basename "$f")
          cp "$f" "staging/${name}-${{ matrix.target }}"
        done < <(find "target/${{ matrix.target }}/release" -maxdepth 1 -type f -executable ! -name '*.d' ! -name '*.so')

    - name: Upload artifacts (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v7
      with:
        name: binaries-${{ matrix.target }}
        path: staging/*
        retention-days: 30

    - name: Collect binaries (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path staging
        Get-ChildItem "target/${{ matrix.target }}/release/*.exe" | ForEach-Object {
          Copy-Item $_.FullName "staging/$($_.BaseName)-${{ matrix.target }}.exe"
        }

    - name: Upload artifacts (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: binaries-${{ matrix.target }}
        path: staging/*
        retention-days: 30

  # NOTE: no job-level `permissions:` here on purpose. Declaring one inside a
  # reusable workflow forces EVERY caller to grant at least that permission or
  # their whole run dies with startup_failure — even on branch/PR runs where
  # this job is skipped by the `if` below. Instead this job inherits whatever
  # the caller grants. Callers that want releases MUST grant `contents: write`
  # at the call site, e.g.:
  #     jobs:
  #       build:
  #         uses: <org>/deb-workflows/.github/workflows/rust-build-exes.yml@main
  #         permissions:
  #           contents: write
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
        pattern: binaries-*

    - name: Create Release
      id: create_release
      continue-on-error: true
      uses: softprops/action-gh-release@v3
      with:
        files: artifacts/**/*
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Explain release failure
      if: steps.create_release.outcome == 'failure'
      run: |
        echo "::error::Creating the release failed. The most common cause is a" \
             "missing 'contents: write' permission: this reusable workflow" \
             "inherits the caller's token, so the CALLER must grant" \
             "'permissions: contents: write' on the job that calls" \
             "rust-build-exes.yml. See the note above the 'release:' job." >&2
        exit 1
