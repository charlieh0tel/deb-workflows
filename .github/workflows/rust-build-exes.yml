name: Build and Release

on:
  workflow_call:
    inputs:
      build-deps:
        description: "Space-separated list of build dependencies to install on Linux"
        required: false
        type: string
        default: ""
      targets:
        description: "JSON array of targets to build"
        required: false
        type: string
        # The Linux images are pinned, not `ubuntu-latest`. A binary links
        # against the builder's glibc and will not run on anything older, so
        # the image decides the oldest system these packages install on:
        # ubuntu-22.04 carries glibc 2.35, which Debian bookworm (2.36) and
        # everything newer accept. Moving these to a newer image silently
        # drops older systems, and `ubuntu-latest` migrates to Ubuntu 26 from
        # 19 October 2026.
        default: '[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04","arch":"amd64"},{"target":"aarch64-unknown-linux-gnu","os":"ubuntu-22.04-arm","arch":"arm64"},{"target":"x86_64-pc-windows-msvc","os":"windows-latest","arch":"amd64"}]'
      run-tests:
        description: "Run tests on amd64 Linux"
        required: false
        type: boolean
        default: true
      test-windows:
        description: "Also run the tests on Windows targets (needs run-tests)"
        required: false
        type: boolean
        default: false
      package:
        description: "Cargo package to build, test and release (cargo -p). Empty = the whole workspace."
        required: false
        type: string
        default: ""
      artifact-suffix:
        description: "Suffix added before the target in artifact names. Required when calling this workflow more than once in one repo."
        required: false
        type: string
        default: ""
      features:
        description: "Comma-separated list of cargo features to enable"
        required: false
        type: string
        default: ""
      audit:
        description: "Audit dependencies against the RustSec advisory database before releasing"
        required: false
        type: boolean
        default: true
      audit-args:
        description: "Extra arguments for cargo audit (e.g. '--ignore RUSTSEC-2024-0001' for an advisory with no fix yet)"
        required: false
        type: string
        default: ""
      toolchain:
        description: "Rust toolchain to install, e.g. 'stable' or '1.98.1'. Empty (the default) takes the channel from the caller's rust-toolchain.toml, falling back to stable. Cargo obeys rust-toolchain.toml whatever is installed, so leaving this empty is how a repo that pins avoids downloading a second toolchain."
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.targets) }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    # dtolnay/rust-toolchain needs an explicit channel -- it does not read
    # rust-toolchain.toml -- so read one out of the file when the caller did
    # not pass a toolchain. Inlined in each job rather than shared: a reusable
    # workflow runs in the CALLER's checkout, so it cannot source a script or
    # composite action from this repo without checking this repo out too.
    - name: Resolve Rust toolchain
      id: rust-toolchain
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        if [ -z "${TOOLCHAIN}" ] && [ -f rust-toolchain.toml ]; then
          TOOLCHAIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
        fi
        TOOLCHAIN="${TOOLCHAIN:-stable}"
        echo "Rust toolchain: ${TOOLCHAIN}"
        echo "toolchain=${TOOLCHAIN}" >> "${GITHUB_OUTPUT}"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
      with:
        toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
        # Install the rustup target this matrix entry builds. A no-op when it
        # is the runner's own target, and what makes a cross target (or a
        # pinned toolchain, which starts out with no targets beyond its host)
        # actually buildable.
        targets: ${{ matrix.target }}

    - name: Cache cargo registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: target
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-target-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

    - name: Install build dependencies (Linux)
      if: runner.os == 'Linux'
      env:
        BUILD_DEPS: ${{ inputs.build-deps }}
      run: |
        read -ra extra_deps <<< "$BUILD_DEPS"
        sudo apt-get update
        sudo apt-get install -y pkg-config "${extra_deps[@]}"

    # bash everywhere: the default shell on Windows is PowerShell,
    # where "${TARGET}" is an (empty) PowerShell variable, not the
    # environment variable.
    - name: Build release binary
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
        FEATURES: ${{ inputs.features }}
        PACKAGE: ${{ inputs.package }}
      run: |
        args=()
        if [[ -n "$FEATURES" ]]; then args+=(--features "$FEATURES"); fi
        if [[ -n "$PACKAGE" ]]; then args+=(--package "$PACKAGE"); fi
        cargo build --release --target "${TARGET}" "${args[@]}" --verbose

    # Keyed on the platform, not on an image name: this said
    # `matrix.os == 'ubuntu-latest'`, so pinning the image below would have
    # switched the tests off silently.
    - name: Run tests
      if: >-
        inputs.run-tests
        && ((runner.os == 'Linux' && matrix.arch == 'amd64')
            || (runner.os == 'Windows' && inputs.test-windows))
      shell: bash
      env:
        FEATURES: ${{ inputs.features }}
        PACKAGE: ${{ inputs.package }}
      run: |
        args=()
        if [[ -n "$FEATURES" ]]; then args+=(--features "$FEATURES"); fi
        if [[ -n "$PACKAGE" ]]; then args+=(--package "$PACKAGE"); fi
        cargo test "${args[@]}" --verbose

    # One bash step for both systems.  With a package, only its own
    # binaries: target/ comes from a cache and can hold other packages'
    # binaries from earlier runs.
    - name: Collect binaries
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
        PACKAGE: ${{ inputs.package }}
      run: |
        release="target/${TARGET}/release"
        exe=""
        if [[ "$RUNNER_OS" == Windows ]]; then exe=".exe"; fi
        files=()
        if [[ -n "$PACKAGE" ]]; then
          # jq on Windows ends lines with CR; drop it.
          mapfile -t bins < <(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg p "$PACKAGE" '.packages[] | select(.name == $p)
                | .targets[] | select(.kind | index("bin")) | .name' \
            | tr -d '\r')
          if [[ ${#bins[@]} -eq 0 ]]; then
            echo "::error::package ${PACKAGE} has no binaries" >&2
            exit 1
          fi
          for bin in "${bins[@]}"; do files+=("${release}/${bin}${exe}"); done
        elif [[ -n "$exe" ]]; then
          files=("${release}"/*.exe)
        else
          mapfile -t files < <(find "$release" -maxdepth 1 -type f -executable ! -name '*.d' ! -name '*.so')
        fi
        mkdir -p staging
        for f in "${files[@]}"; do
          name=$(basename "$f" "$exe")
          cp "$f" "staging/${name}-${TARGET}${exe}"
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: binaries-${{ inputs.artifact-suffix != '' && format('{0}-', inputs.artifact-suffix) || '' }}${{ matrix.target }}
        path: staging/*
        retention-days: 30

  audit:
    if: inputs.audit
    runs-on: ubuntu-latest
    # cargo-audit reads Cargo.lock directly, so the caller's toolchain pin has
    # no bearing on the result. Forcing the runner's preinstalled stable keeps
    # this job from downloading a pinned toolchain just to install one binary,
    # and keeps an old pin from failing to build a current cargo-audit.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    # Same shape as cargo-deb in rust-build-deb.yml: build it once, then reuse
    # the binary. Bump the key's version suffix to force a rebuild; the
    # advisory database itself is fetched fresh on every run, so a cached
    # binary does not mean stale advisories.
    - name: Cache cargo-audit
      id: cache-cargo-audit
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cargo/bin/cargo-audit
        key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-v1
    - name: Install cargo-audit
      if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
      run: cargo install cargo-audit --locked
    - name: Audit dependencies
      id: cargo-audit
      env:
        AUDIT_ARGS: ${{ inputs.audit-args }}
      run: |
        read -ra audit_args <<< "$AUDIT_ARGS"
        # A binary crate commits its lockfile; a library usually does not, and
        # cargo audit has nothing to read without one.
        if [ ! -f Cargo.lock ]; then
          echo "No Cargo.lock in the repository; generating one to audit."
          cargo generate-lockfile
        fi
        cargo audit "${audit_args[@]}"

  # NOTE: no job-level `permissions:` here on purpose. Declaring one inside a
  # reusable workflow forces EVERY caller to grant at least that permission or
  # their whole run dies with startup_failure — even on branch/PR runs where
  # this job is skipped by the `if` below. Instead this job inherits whatever
  # the caller grants. Callers that want releases MUST grant `contents: write`
  # at the call site, e.g.:
  #     jobs:
  #       build:
  #         uses: <org>/deb-workflows/.github/workflows/rust-build-exes.yml@v1
  #         permissions:
  #           contents: write
  release:
    needs: [build, audit]
    # `audit` is skipped when a caller sets audit: false, and a skipped job in
    # needs() would take this one down with it, so the gate is spelled out:
    # release a tag when the build passed and the audit did not fail.
    if: >-
      !cancelled()
      && startsWith(github.ref, 'refs/tags/v')
      && needs.build.result == 'success'
      && needs.audit.result != 'failure'
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        path: artifacts
        pattern: binaries-*

    - name: Create Release
      id: create_release
      continue-on-error: true
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
      with:
        files: artifacts/**/*
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Explain release failure
      if: steps.create_release.outcome == 'failure'
      run: |
        echo "::error::Creating the release failed. The most common cause is a" \
             "missing 'contents: write' permission: this reusable workflow" \
             "inherits the caller's token, so the CALLER must grant" \
             "'permissions: contents: write' on the job that calls" \
             "rust-build-exes.yml. See the note above the 'release:' job." >&2
        exit 1
