name: Rust CI

on:
  workflow_call:
    inputs:
      toolchain:
        description: "Rust toolchain to install, e.g. 'stable' or '1.98.1'. Empty (the default) takes the channel from the caller's rust-toolchain.toml, falling back to stable. Cargo obeys rust-toolchain.toml whatever is installed, so leaving this empty is how a repo that pins avoids downloading a second toolchain."
        required: false
        type: string
        default: ""
      fmt-toolchain:
        description: "Toolchain for cargo fmt (e.g. nightly). Empty resolves like `toolchain`, for a repo that wants one toolchain for everything."
        required: false
        type: string
        default: "nightly"
      targets:
        description: "Space-separated list of extra targets to install"
        required: false
        type: string
        default: ""
      build-deps:
        description: "Space-separated apt packages to install"
        required: false
        type: string
        default: ""
      check-args:
        description: "Extra arguments for cargo check and clippy"
        required: false
        type: string
        default: ""
      submodules:
        description: "Whether to checkout submodules: 'true', 'false', or 'recursive'. A workspace whose members or vendored sources live in submodules needs this."
        required: false
        type: string
        default: "false"
      test-args:
        description: "Extra arguments for cargo test (e.g. '--features testing')"
        required: false
        type: string
        default: ""
      cache-directories:
        description: "Extra paths for the cargo cache to keep, one per line. A build script that fetches sources into target/ needs its path here, or the cache prunes it and the fetch repeats every run."
        required: false
        type: string
        default: ""
      audit:
        description: "Audit dependencies against the RustSec advisory database"
        required: false
        type: boolean
        default: true
      audit-args:
        description: "Extra arguments for cargo audit (e.g. '--ignore RUSTSEC-2024-0001' for an advisory with no fix yet)"
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

# Pure CI: never writes. A called workflow can only narrow the caller's
# token, never widen it.
permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        submodules: ${{ inputs.submodules }}
    # dtolnay/rust-toolchain needs an explicit channel -- it does not read
    # rust-toolchain.toml -- so read one out of the file when the caller did
    # not pass a toolchain. Inlined in each job rather than shared: a reusable
    # workflow runs in the CALLER's checkout, so it cannot source a script or
    # composite action from this repo without checking this repo out too.
    - name: Resolve Rust toolchain
      id: rust-toolchain
      env:
        TOOLCHAIN: ${{ inputs.fmt-toolchain }}
      run: |
        if [ -z "${TOOLCHAIN}" ] && [ -f rust-toolchain.toml ]; then
          TOOLCHAIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
        fi
        TOOLCHAIN="${TOOLCHAIN:-stable}"
        echo "Rust toolchain: ${TOOLCHAIN}"
        echo "toolchain=${TOOLCHAIN}" >> "${GITHUB_OUTPUT}"

    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
      with:
        toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
        components: rustfmt
    # +toolchain, not a bare `cargo fmt`: a rust-toolchain.toml in the caller
    # outranks whatever was just installed, which would silently run rustfmt
    # from the pinned stable instead of the fmt toolchain asked for here.
    - env:
        TOOLCHAIN: ${{ steps.rust-toolchain.outputs.toolchain }}
      run: cargo "+${TOOLCHAIN}" fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        submodules: ${{ inputs.submodules }}
    # dtolnay/rust-toolchain needs an explicit channel -- it does not read
    # rust-toolchain.toml -- so read one out of the file when the caller did
    # not pass a toolchain. Inlined in each job rather than shared: a reusable
    # workflow runs in the CALLER's checkout, so it cannot source a script or
    # composite action from this repo without checking this repo out too.
    - name: Resolve Rust toolchain
      id: rust-toolchain
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        if [ -z "${TOOLCHAIN}" ] && [ -f rust-toolchain.toml ]; then
          TOOLCHAIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
        fi
        TOOLCHAIN="${TOOLCHAIN:-stable}"
        echo "Rust toolchain: ${TOOLCHAIN}"
        echo "toolchain=${TOOLCHAIN}" >> "${GITHUB_OUTPUT}"

    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
      with:
        toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
        targets: ${{ inputs.targets }}
        components: clippy
    # Without this every run compiles the whole dependency tree again. Keyed on
    # the job, so clippy and test do not evict one another.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      with:
        cache-directories: ${{ inputs.cache-directories }}
    - name: Install build dependencies
      if: inputs.build-deps != ''
      env:
        BUILD_DEPS: ${{ inputs.build-deps }}
      run: |
        read -ra extra_deps <<< "$BUILD_DEPS"
        sudo apt-get update
        sudo apt-get install -y pkg-config "${extra_deps[@]}"
    - env:
        CHECK_ARGS: ${{ inputs.check-args }}
      run: |
        read -ra check_args <<< "$CHECK_ARGS"
        cargo clippy "${check_args[@]}" -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        submodules: ${{ inputs.submodules }}
    # dtolnay/rust-toolchain needs an explicit channel -- it does not read
    # rust-toolchain.toml -- so read one out of the file when the caller did
    # not pass a toolchain. Inlined in each job rather than shared: a reusable
    # workflow runs in the CALLER's checkout, so it cannot source a script or
    # composite action from this repo without checking this repo out too.
    - name: Resolve Rust toolchain
      id: rust-toolchain
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        if [ -z "${TOOLCHAIN}" ] && [ -f rust-toolchain.toml ]; then
          TOOLCHAIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
        fi
        TOOLCHAIN="${TOOLCHAIN:-stable}"
        echo "Rust toolchain: ${TOOLCHAIN}"
        echo "toolchain=${TOOLCHAIN}" >> "${GITHUB_OUTPUT}"

    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
      with:
        toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      with:
        cache-directories: ${{ inputs.cache-directories }}
    - name: Install build dependencies
      if: inputs.build-deps != ''
      env:
        BUILD_DEPS: ${{ inputs.build-deps }}
      run: |
        read -ra extra_deps <<< "$BUILD_DEPS"
        sudo apt-get update
        sudo apt-get install -y pkg-config "${extra_deps[@]}"
    - env:
        TEST_ARGS: ${{ inputs.test-args }}
      run: |
        read -ra test_args <<< "$TEST_ARGS"
        cargo test "${test_args[@]}" --verbose

  audit:
    if: inputs.audit
    runs-on: ubuntu-latest
    # cargo-audit reads Cargo.lock directly, so the caller's toolchain pin has
    # no bearing on the result. Forcing the runner's preinstalled stable keeps
    # this job from downloading a pinned toolchain just to install one binary,
    # and keeps an old pin from failing to build a current cargo-audit.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    # Same shape as cargo-deb in rust-build-deb.yml: build it once, then reuse
    # the binary. Bump the key's version suffix to force a rebuild; the
    # advisory database itself is fetched fresh on every run, so a cached
    # binary does not mean stale advisories.
    - name: Cache cargo-audit
      id: cache-cargo-audit
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cargo/bin/cargo-audit
        key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-v1
    - name: Install cargo-audit
      if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
      run: cargo install cargo-audit --locked
    - name: Audit dependencies
      id: cargo-audit
      env:
        AUDIT_ARGS: ${{ inputs.audit-args }}
      run: |
        read -ra audit_args <<< "$AUDIT_ARGS"
        # A binary crate commits its lockfile; a library usually does not, and
        # cargo audit has nothing to read without one.
        if [ ! -f Cargo.lock ]; then
          echo "No Cargo.lock in the repository; generating one to audit."
          cargo generate-lockfile
        fi
        cargo audit "${audit_args[@]}"
