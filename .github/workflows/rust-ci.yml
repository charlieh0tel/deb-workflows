name: Rust CI

on:
  workflow_call:
    inputs:
      toolchain:
        description: "Rust toolchain (e.g. stable, nightly)"
        required: false
        type: string
        default: "stable"
      fmt-toolchain:
        description: "Toolchain for cargo fmt (e.g. nightly)"
        required: false
        type: string
        default: "nightly"
      targets:
        description: "Space-separated list of extra targets to install"
        required: false
        type: string
        default: ""
      build-deps:
        description: "Space-separated apt packages to install"
        required: false
        type: string
        default: ""
      check-args:
        description: "Extra arguments for cargo check and clippy"
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

# Pure CI: never writes. A called workflow can only narrow the caller's
# token, never widen it.
permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
      with:
        toolchain: ${{ inputs.fmt-toolchain }}
        components: rustfmt
    - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
        components: clippy
    - name: Install build dependencies
      if: inputs.build-deps != ''
      env:
        BUILD_DEPS: ${{ inputs.build-deps }}
      run: |
        read -ra extra_deps <<< "$BUILD_DEPS"
        sudo apt-get update
        sudo apt-get install -y pkg-config "${extra_deps[@]}"
    - env:
        CHECK_ARGS: ${{ inputs.check-args }}
      run: |
        read -ra check_args <<< "$CHECK_ARGS"
        cargo clippy "${check_args[@]}" -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
      with:
        toolchain: ${{ inputs.toolchain }}
    - name: Install build dependencies
      if: inputs.build-deps != ''
      env:
        BUILD_DEPS: ${{ inputs.build-deps }}
      run: |
        read -ra extra_deps <<< "$BUILD_DEPS"
        sudo apt-get update
        sudo apt-get install -y pkg-config "${extra_deps[@]}"
    - run: cargo test --verbose
