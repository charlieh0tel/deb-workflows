name: Rust CI

on:
  workflow_call:
    inputs:
      toolchain:
        description: "Rust toolchain to install, e.g. 'stable' or '1.98.1'. Empty (the default) takes the channel from the caller's rust-toolchain.toml, falling back to stable. Cargo obeys rust-toolchain.toml whatever is installed, so leaving this empty is how a repo that pins avoids downloading a second toolchain."
        required: false
        type: string
        default: ""
      fmt-toolchain:
        description: "Toolchain for cargo fmt (e.g. nightly). Empty resolves like `toolchain`, for a repo that wants one toolchain for everything."
        required: false
        type: string
        default: "nightly"
      targets:
        description: "Space-separated list of extra targets to install"
        required: false
        type: string
        default: ""
      build-deps:
        description: "Space-separated apt packages to install"
        required: false
        type: string
        default: ""
      check-args:
        description: "Extra arguments for cargo check and clippy"
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

# Pure CI: never writes. A called workflow can only narrow the caller's
# token, never widen it.
permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    # dtolnay/rust-toolchain needs an explicit channel -- it does not read
    # rust-toolchain.toml -- so read one out of the file when the caller did
    # not pass a toolchain. Inlined in each job rather than shared: a reusable
    # workflow runs in the CALLER's checkout, so it cannot source a script or
    # composite action from this repo without checking this repo out too.
    - name: Resolve Rust toolchain
      id: rust-toolchain
      env:
        TOOLCHAIN: ${{ inputs.fmt-toolchain }}
      run: |
        if [ -z "${TOOLCHAIN}" ] && [ -f rust-toolchain.toml ]; then
          TOOLCHAIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
        fi
        TOOLCHAIN="${TOOLCHAIN:-stable}"
        echo "Rust toolchain: ${TOOLCHAIN}"
        echo "toolchain=${TOOLCHAIN}" >> "${GITHUB_OUTPUT}"

    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
      with:
        toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
        components: rustfmt
    # +toolchain, not a bare `cargo fmt`: a rust-toolchain.toml in the caller
    # outranks whatever was just installed, which would silently run rustfmt
    # from the pinned stable instead of the fmt toolchain asked for here.
    - env:
        TOOLCHAIN: ${{ steps.rust-toolchain.outputs.toolchain }}
      run: cargo "+${TOOLCHAIN}" fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    # dtolnay/rust-toolchain needs an explicit channel -- it does not read
    # rust-toolchain.toml -- so read one out of the file when the caller did
    # not pass a toolchain. Inlined in each job rather than shared: a reusable
    # workflow runs in the CALLER's checkout, so it cannot source a script or
    # composite action from this repo without checking this repo out too.
    - name: Resolve Rust toolchain
      id: rust-toolchain
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        if [ -z "${TOOLCHAIN}" ] && [ -f rust-toolchain.toml ]; then
          TOOLCHAIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
        fi
        TOOLCHAIN="${TOOLCHAIN:-stable}"
        echo "Rust toolchain: ${TOOLCHAIN}"
        echo "toolchain=${TOOLCHAIN}" >> "${GITHUB_OUTPUT}"

    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
      with:
        toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
        targets: ${{ inputs.targets }}
        components: clippy
    - name: Install build dependencies
      if: inputs.build-deps != ''
      env:
        BUILD_DEPS: ${{ inputs.build-deps }}
      run: |
        read -ra extra_deps <<< "$BUILD_DEPS"
        sudo apt-get update
        sudo apt-get install -y pkg-config "${extra_deps[@]}"
    - env:
        CHECK_ARGS: ${{ inputs.check-args }}
      run: |
        read -ra check_args <<< "$CHECK_ARGS"
        cargo clippy "${check_args[@]}" -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    # dtolnay/rust-toolchain needs an explicit channel -- it does not read
    # rust-toolchain.toml -- so read one out of the file when the caller did
    # not pass a toolchain. Inlined in each job rather than shared: a reusable
    # workflow runs in the CALLER's checkout, so it cannot source a script or
    # composite action from this repo without checking this repo out too.
    - name: Resolve Rust toolchain
      id: rust-toolchain
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        if [ -z "${TOOLCHAIN}" ] && [ -f rust-toolchain.toml ]; then
          TOOLCHAIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
        fi
        TOOLCHAIN="${TOOLCHAIN:-stable}"
        echo "Rust toolchain: ${TOOLCHAIN}"
        echo "toolchain=${TOOLCHAIN}" >> "${GITHUB_OUTPUT}"

    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
      with:
        toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
    - name: Install build dependencies
      if: inputs.build-deps != ''
      env:
        BUILD_DEPS: ${{ inputs.build-deps }}
      run: |
        read -ra extra_deps <<< "$BUILD_DEPS"
        sudo apt-get update
        sudo apt-get install -y pkg-config "${extra_deps[@]}"
    - run: cargo test --verbose
