name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version"
        required: false
        type: string
        default: "3.12"
      working-directory:
        description: "Directory to run in (also where uv detection looks)"
        required: false
        type: string
        default: "."
      use-uv:
        description: "Use uv: 'auto' (detect uv.lock/uv.toml/[tool.uv]), 'true', or 'false'"
        required: false
        type: string
        default: "auto"
      requirements-file:
        description: "Path to requirements.txt, relative to working-directory (empty to skip install; ignored when uv is used)"
        required: false
        type: string
        default: "requirements.txt"
      test-command:
        description: "Command to run tests (empty to skip)"
        required: false
        type: string
        default: "pytest --showlocals -rA"
      lint-command:
        description: "Command to run linter (empty to skip)"
        required: false
        type: string
        default: "ruff check ."
      format-check-command:
        description: "Command to check formatting (empty to skip)"
        required: false
        type: string
        default: "ruff format --check ."

jobs:
  lint:
    if: inputs.lint-command != ''
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Detect uv
      id: detect
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        USE_UV: ${{ inputs.use-uv }}
      run: |
        case "${USE_UV}" in
          true|false) uv="${USE_UV}" ;;
          auto)
            if [ -f uv.lock ] || [ -f uv.toml ] || grep -qs '^\[tool\.uv' pyproject.toml; then
              uv=true
            else
              uv=false
            fi
            ;;
          *) echo "::error::use-uv must be 'auto', 'true' or 'false' (got '${USE_UV}')"; exit 1 ;;
        esac
        echo "Using uv: ${uv}"
        echo "uv=${uv}" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-python@v7
      if: steps.detect.outputs.uv != 'true'
      with:
        python-version: ${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@v9.0.0  # no floating vN tag published after v7
      if: steps.detect.outputs.uv == 'true'
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
    - if: steps.detect.outputs.uv != 'true'
      run: pip install ruff
    - name: Lint
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        LINT_CMD: ${{ inputs.lint-command }}
        UV: ${{ steps.detect.outputs.uv }}
      run: |
        if [ "${UV}" = true ]; then
          # Word splitting of the command string is intentional.
          # shellcheck disable=SC2086
          uv run --with ruff -- $LINT_CMD
        else
          $LINT_CMD
        fi

  format:
    if: inputs.format-check-command != ''
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Detect uv
      id: detect
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        USE_UV: ${{ inputs.use-uv }}
      run: |
        case "${USE_UV}" in
          true|false) uv="${USE_UV}" ;;
          auto)
            if [ -f uv.lock ] || [ -f uv.toml ] || grep -qs '^\[tool\.uv' pyproject.toml; then
              uv=true
            else
              uv=false
            fi
            ;;
          *) echo "::error::use-uv must be 'auto', 'true' or 'false' (got '${USE_UV}')"; exit 1 ;;
        esac
        echo "Using uv: ${uv}"
        echo "uv=${uv}" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-python@v7
      if: steps.detect.outputs.uv != 'true'
      with:
        python-version: ${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@v9.0.0  # no floating vN tag published after v7
      if: steps.detect.outputs.uv == 'true'
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
    - if: steps.detect.outputs.uv != 'true'
      run: pip install ruff
    - name: Format check
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        FMT_CMD: ${{ inputs.format-check-command }}
        UV: ${{ steps.detect.outputs.uv }}
      run: |
        if [ "${UV}" = true ]; then
          # Word splitting of the command string is intentional.
          # shellcheck disable=SC2086
          uv run --with ruff -- $FMT_CMD
        else
          $FMT_CMD
        fi

  test:
    if: inputs.test-command != ''
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Detect uv
      id: detect
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        USE_UV: ${{ inputs.use-uv }}
      run: |
        case "${USE_UV}" in
          true|false) uv="${USE_UV}" ;;
          auto)
            if [ -f uv.lock ] || [ -f uv.toml ] || grep -qs '^\[tool\.uv' pyproject.toml; then
              uv=true
            else
              uv=false
            fi
            ;;
          *) echo "::error::use-uv must be 'auto', 'true' or 'false' (got '${USE_UV}')"; exit 1 ;;
        esac
        echo "Using uv: ${uv}"
        echo "uv=${uv}" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-python@v7
      if: steps.detect.outputs.uv != 'true'
      with:
        python-version: ${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@v9.0.0  # no floating vN tag published after v7
      if: steps.detect.outputs.uv == 'true'
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
    - name: Install dependencies
      if: steps.detect.outputs.uv != 'true'
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        REQS: ${{ inputs.requirements-file }}
      run: |
        pip install pytest ruff
        if [ -n "${REQS}" ] && [ -f "${REQS}" ]; then
          pip install -r "${REQS}"
        fi
    - name: Sync dependencies (uv)
      if: steps.detect.outputs.uv == 'true'
      working-directory: ${{ inputs.working-directory || '.' }}
      run: |
        if [ -f pyproject.toml ]; then
          uv sync
        else
          echo "No pyproject.toml; skipping uv sync"
        fi
    - name: Test
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        TEST_CMD: ${{ inputs.test-command }}
        UV: ${{ steps.detect.outputs.uv }}
      run: |
        if [ "${UV}" = true ]; then
          # Word splitting of the command string is intentional.
          # shellcheck disable=SC2086
          uv run --with pytest -- $TEST_CMD
        else
          $TEST_CMD
        fi
