name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version"
        required: false
        type: string
        default: "3.12"
      working-directory:
        description: "Directory to run in (also where uv detection looks)"
        required: false
        type: string
        default: "."
      use-uv:
        description: "Use uv: 'auto' (detect uv.lock/uv.toml/[tool.uv]), 'true', or 'false'"
        required: false
        type: string
        default: "auto"
      locked:
        description: "Assert the uv lockfile is up to date (uv sync --locked). uv only."
        required: false
        type: boolean
        default: false
      system-packages:
        description: "Space-separated apt packages to install before dependencies"
        required: false
        type: string
        default: ""
      requirements-file:
        description: "Path to requirements.txt, relative to working-directory (empty to skip install; ignored when uv is used)"
        required: false
        type: string
        default: "requirements.txt"
      test-command:
        description: "Command to run tests (empty to skip)"
        required: false
        type: string
        default: "pytest --showlocals -rA"
      lint-command:
        description: "Command to run linter (empty to skip)"
        required: false
        type: string
        default: "ruff check ."
      format-check-command:
        description: "Command to check formatting (empty to skip)"
        required: false
        type: string
        default: "ruff format --check ."

jobs:
  # Detected once and consumed by the three jobs below via `needs`, so the
  # detection rules live in exactly one place. A composite action would also
  # work, but relative `uses: ./...` paths in a *reusable* workflow resolve
  # against the caller's workspace, so it would break for external callers.
  detect:
    if: inputs.lint-command != '' || inputs.format-check-command != '' || inputs.test-command != ''
    runs-on: ubuntu-latest
    outputs:
      uv: ${{ steps.detect.outputs.uv }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Detect uv
      id: detect
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        USE_UV: ${{ inputs.use-uv }}
      run: |
        case "${USE_UV}" in
          true|false) uv="${USE_UV}" ;;
          auto)
            if [ -f uv.lock ] || [ -f uv.toml ] || grep -qs '^\[tool\.uv' pyproject.toml; then
              uv=true
            else
              uv=false
            fi
            ;;
          *) echo "::error::use-uv must be 'auto', 'true' or 'false' (got '${USE_UV}')"; exit 1 ;;
        esac
        echo "Using uv: ${uv}"
        echo "uv=${uv}" >> "$GITHUB_OUTPUT"

  lint:
    if: inputs.lint-command != ''
    needs: detect
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install system packages
      if: inputs.system-packages != ''
      env:
        PKGS: ${{ inputs.system-packages }}
      run: |
        # Word splitting of the package list is intentional.
        # shellcheck disable=SC2086
        sudo apt-get update && sudo apt-get install -y --no-install-recommends $PKGS
    - uses: actions/setup-python@v7
      if: needs.detect.outputs.uv != 'true'
      with:
        python-version: ${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@v9.0.0  # no floating vN tag published after v7
      if: needs.detect.outputs.uv == 'true'
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
    - if: needs.detect.outputs.uv != 'true'
      run: pip install ruff
    - name: Sync dependencies (uv)
      if: needs.detect.outputs.uv == 'true'
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        LOCKED: ${{ inputs.locked }}
      run: |
        if [ ! -f pyproject.toml ]; then
          echo "No pyproject.toml; skipping uv sync"
        elif [ "${LOCKED}" = true ]; then
          uv sync --locked
        else
          uv sync
        fi
    - name: Lint
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        CMD: ${{ inputs.lint-command }}
        UV: ${{ needs.detect.outputs.uv }}
      run: |
        tool=${CMD%% *}
        # Prefer the tool locked in the project environment, so CI uses the
        # pinned version rather than whatever is current on PyPI today. The
        # check must look in the project venv specifically: `command -v` would
        # also match a same-named tool preinstalled on the runner image.
        # Word splitting of the command string is intentional throughout.
        # shellcheck disable=SC2086
        if [ "${UV}" != true ]; then
          $CMD
        elif [ -f pyproject.toml ] && [ -x "$(dirname "$(uv python find)")/${tool}" ]; then
          echo "Running ${tool} from the project environment"
          uv run --no-sync -- $CMD
        else
          echo "${tool} is not a project dependency; falling back to 'uv run --with'"
          uv run --with "${tool}" -- $CMD
        fi

  format:
    if: inputs.format-check-command != ''
    needs: detect
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install system packages
      if: inputs.system-packages != ''
      env:
        PKGS: ${{ inputs.system-packages }}
      run: |
        # Word splitting of the package list is intentional.
        # shellcheck disable=SC2086
        sudo apt-get update && sudo apt-get install -y --no-install-recommends $PKGS
    - uses: actions/setup-python@v7
      if: needs.detect.outputs.uv != 'true'
      with:
        python-version: ${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@v9.0.0  # no floating vN tag published after v7
      if: needs.detect.outputs.uv == 'true'
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
    - if: needs.detect.outputs.uv != 'true'
      run: pip install ruff
    - name: Sync dependencies (uv)
      if: needs.detect.outputs.uv == 'true'
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        LOCKED: ${{ inputs.locked }}
      run: |
        if [ ! -f pyproject.toml ]; then
          echo "No pyproject.toml; skipping uv sync"
        elif [ "${LOCKED}" = true ]; then
          uv sync --locked
        else
          uv sync
        fi
    - name: Format check
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        CMD: ${{ inputs.format-check-command }}
        UV: ${{ needs.detect.outputs.uv }}
      run: |
        tool=${CMD%% *}
        # Prefer the tool locked in the project environment, so CI uses the
        # pinned version rather than whatever is current on PyPI today. The
        # check must look in the project venv specifically: `command -v` would
        # also match a same-named tool preinstalled on the runner image.
        # Word splitting of the command string is intentional throughout.
        # shellcheck disable=SC2086
        if [ "${UV}" != true ]; then
          $CMD
        elif [ -f pyproject.toml ] && [ -x "$(dirname "$(uv python find)")/${tool}" ]; then
          echo "Running ${tool} from the project environment"
          uv run --no-sync -- $CMD
        else
          echo "${tool} is not a project dependency; falling back to 'uv run --with'"
          uv run --with "${tool}" -- $CMD
        fi

  test:
    if: inputs.test-command != ''
    needs: detect
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install system packages
      if: inputs.system-packages != ''
      env:
        PKGS: ${{ inputs.system-packages }}
      run: |
        # Word splitting of the package list is intentional.
        # shellcheck disable=SC2086
        sudo apt-get update && sudo apt-get install -y --no-install-recommends $PKGS
    - uses: actions/setup-python@v7
      if: needs.detect.outputs.uv != 'true'
      with:
        python-version: ${{ inputs.python-version }}
    - uses: astral-sh/setup-uv@v9.0.0  # no floating vN tag published after v7
      if: needs.detect.outputs.uv == 'true'
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
    - name: Install dependencies
      if: needs.detect.outputs.uv != 'true'
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        REQS: ${{ inputs.requirements-file }}
      run: |
        pip install pytest ruff
        if [ -n "${REQS}" ] && [ -f "${REQS}" ]; then
          pip install -r "${REQS}"
        fi
    - name: Sync dependencies (uv)
      if: needs.detect.outputs.uv == 'true'
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        LOCKED: ${{ inputs.locked }}
      run: |
        if [ ! -f pyproject.toml ]; then
          echo "No pyproject.toml; skipping uv sync"
        elif [ "${LOCKED}" = true ]; then
          uv sync --locked
        else
          uv sync
        fi
    - name: Test
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        CMD: ${{ inputs.test-command }}
        UV: ${{ needs.detect.outputs.uv }}
      run: |
        tool=${CMD%% *}
        # Prefer the tool locked in the project environment, so CI uses the
        # pinned version rather than whatever is current on PyPI today. The
        # check must look in the project venv specifically: `command -v` would
        # also match a same-named tool preinstalled on the runner image.
        # Word splitting of the command string is intentional throughout.
        # shellcheck disable=SC2086
        if [ "${UV}" != true ]; then
          $CMD
        elif [ -f pyproject.toml ] && [ -x "$(dirname "$(uv python find)")/${tool}" ]; then
          echo "Running ${tool} from the project environment"
          uv run --no-sync -- $CMD
        else
          echo "${tool} is not a project dependency; falling back to 'uv run --with'"
          uv run --with "${tool}" -- $CMD
        fi
