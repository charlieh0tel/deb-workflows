name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version"
        required: false
        type: string
        default: "3.12"
      working-directory:
        description: "Directory to run in (also where uv detection looks)"
        required: false
        type: string
        default: "."
      use-uv:
        description: "Use uv: 'auto' (detect uv.lock/uv.toml/[tool.uv]), 'true', or 'false'"
        required: false
        type: string
        default: "auto"
      lock-check:
        description: "Assert the uv lockfile is up to date: 'auto' (strict when uv.lock exists), 'true', or 'false'. uv only."
        required: false
        type: string
        default: "auto"
      system-packages:
        description: "Space-separated apt packages to install before dependencies"
        required: false
        type: string
        default: ""
      requirements-file:
        description: "Path to requirements.txt, relative to working-directory (empty to skip install; ignored when uv is used)"
        required: false
        type: string
        default: "requirements.txt"
      test-command:
        description: "Command to run tests (empty to skip). Must start with the tool name: a VAR=value prefix is not supported."
        required: false
        type: string
        default: "pytest --showlocals -rA"
      lint-command:
        description: "Command to run linter (empty to skip). Must start with the tool name: a VAR=value prefix is not supported."
        required: false
        type: string
        default: "ruff check ."
      format-check-command:
        description: "Command to check formatting (empty to skip). Must start with the tool name: a VAR=value prefix is not supported."
        required: false
        type: string
        default: "ruff format --check ."

# The uv-sync/uv-run steps below reference this repo's composite actions by
# absolute ref. Relative `./` paths would resolve against the *caller's*
# workspace and break for external callers, so the ref is pinned to the v1
# major tag -- the same ref callers are told to use for this workflow, so a
# caller on @v1 gets a self-consistent bundle.
#
# Consequence for development: on main these steps run v1's actions, not
# main's. After changing an action, move v1 and re-run CI to validate the new
# pairing. The stale-lock test in test-python-ci.yml deliberately uses a
# relative ref, so it always exercises the working tree's copy.
#
# Only ever needs to read the caller's code. A called workflow can only
# narrow the caller's token, never widen it.
permissions:
  contents: read

jobs:
  # Detected once and consumed by the three jobs below via `needs`, so the
  # detection rules live in exactly one place. A composite action would also
  # work, but relative `uses: ./...` paths in a *reusable* workflow resolve
  # against the caller's workspace, so it would break for external callers.
  detect:
    if: inputs.lint-command != '' || inputs.format-check-command != '' || inputs.test-command != ''
    runs-on: ubuntu-latest
    outputs:
      uv: ${{ steps.detect.outputs.uv }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Detect uv
      id: detect
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        USE_UV: ${{ inputs.use-uv }}
      run: |
        case "${USE_UV}" in
          true|false) uv="${USE_UV}" ;;
          auto)
            if [ -f uv.lock ] || [ -f uv.toml ] || grep -qs '^\[tool\.uv' pyproject.toml; then
              uv=true
            else
              uv=false
            fi
            ;;
          *) echo "::error::use-uv must be 'auto', 'true' or 'false' (got '${USE_UV}')"; exit 1 ;;
        esac
        echo "Using uv: ${uv}"
        echo "uv=${uv}" >> "$GITHUB_OUTPUT"

  lint:
    if: inputs.lint-command != ''
    needs: detect
    runs-on: ubuntu-latest
    steps:
    - uses: charlieh0tel/deb-workflows/.github/actions/setup-python-ci@v1
      with:
        python-version: ${{ inputs.python-version }}
        system-packages: ${{ inputs.system-packages }}
        uv: ${{ needs.detect.outputs.uv }}
    - if: needs.detect.outputs.uv != 'true'
      run: pip install ruff
    - name: Sync dependencies (uv)
      if: needs.detect.outputs.uv == 'true'
      uses: charlieh0tel/deb-workflows/.github/actions/uv-sync@v1
      with:
        working-directory: ${{ inputs.working-directory || '.' }}
        lock-check: ${{ inputs.lock-check }}
    - name: Lint
      uses: charlieh0tel/deb-workflows/.github/actions/uv-run@v1
      with:
        working-directory: ${{ inputs.working-directory || '.' }}
        command: ${{ inputs.lint-command }}
        uv: ${{ needs.detect.outputs.uv }}

  format:
    if: inputs.format-check-command != ''
    needs: detect
    runs-on: ubuntu-latest
    steps:
    - uses: charlieh0tel/deb-workflows/.github/actions/setup-python-ci@v1
      with:
        python-version: ${{ inputs.python-version }}
        system-packages: ${{ inputs.system-packages }}
        uv: ${{ needs.detect.outputs.uv }}
    - if: needs.detect.outputs.uv != 'true'
      run: pip install ruff
    - name: Sync dependencies (uv)
      if: needs.detect.outputs.uv == 'true'
      uses: charlieh0tel/deb-workflows/.github/actions/uv-sync@v1
      with:
        working-directory: ${{ inputs.working-directory || '.' }}
        lock-check: ${{ inputs.lock-check }}
    - name: Format check
      uses: charlieh0tel/deb-workflows/.github/actions/uv-run@v1
      with:
        working-directory: ${{ inputs.working-directory || '.' }}
        command: ${{ inputs.format-check-command }}
        uv: ${{ needs.detect.outputs.uv }}

  test:
    if: inputs.test-command != ''
    needs: detect
    runs-on: ubuntu-latest
    steps:
    - uses: charlieh0tel/deb-workflows/.github/actions/setup-python-ci@v1
      with:
        python-version: ${{ inputs.python-version }}
        system-packages: ${{ inputs.system-packages }}
        uv: ${{ needs.detect.outputs.uv }}
    - name: Install dependencies
      if: needs.detect.outputs.uv != 'true'
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        REQS: ${{ inputs.requirements-file }}
      run: |
        pip install pytest ruff
        if [ -n "${REQS}" ] && [ -f "${REQS}" ]; then
          pip install -r "${REQS}"
        fi
    - name: Sync dependencies (uv)
      if: needs.detect.outputs.uv == 'true'
      uses: charlieh0tel/deb-workflows/.github/actions/uv-sync@v1
      with:
        working-directory: ${{ inputs.working-directory || '.' }}
        lock-check: ${{ inputs.lock-check }}
    - name: Test
      uses: charlieh0tel/deb-workflows/.github/actions/uv-run@v1
      with:
        working-directory: ${{ inputs.working-directory || '.' }}
        command: ${{ inputs.test-command }}
        uv: ${{ needs.detect.outputs.uv }}
